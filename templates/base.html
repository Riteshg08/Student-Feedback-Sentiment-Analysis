<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Feedback Sentiment Analysis{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="{{ url_for('display') }}">Student Feedback Sentiment Analysis</a>
        </div>
    </header>
    <main id="main" class="wrap">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="wrap">
            <p>Classifies comments as positive, neutral, or negative. Names and emails are never displayed.</p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
